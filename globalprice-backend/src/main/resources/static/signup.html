<!doctype html>
<html lang="ko" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 — GlobalPrice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
<div id="site-header"></div>

<main class="page container">
  <section class="card auth-wrap">
    <h1>회원가입</h1>
    <p class="muted" style="margin:0 0 16px;font-size:14px">가입하면 관심 상품 저장과 가격 하락 알림을 받을 수 있어요.</p>
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <span class="error-text" id="emailErr"></span>
      </div>
      <div class="field">
        <label for="nickname">닉네임</label>
        <input id="nickname" name="nickname" type="text" autocomplete="nickname" required minlength="2" maxlength="12">
        <span class="error-text" id="nicknameErr"></span>
      </div>
      <div class="field">
        <label for="password">비밀번호 (영문 · 숫자 포함 8자 이상)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
        <span class="error-text" id="passwordErr"></span>
      </div>
      <div class="field">
        <label for="password2">비밀번호 확인</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password" required>
        <span class="error-text" id="password2Err"></span>
      </div>
      <label class="small" style="display:flex;gap:8px;align-items:flex-start">
        <input type="checkbox" name="agree" id="agree" style="margin-top:3px;accent-color:var(--primary)">
        <span>(필수) 이용약관 및 개인정보 수집 · 이용에 동의합니다.</span>
      </label>
      <span class="error-text" id="agreeErr"></span>
      <p class="error-text" id="formErr" role="alert" style="margin:0"></p>
      <button type="submit" class="btn btn-primary">가입하기</button>
      <p class="small" style="text-align:center;margin:0">이미 회원이신가요? <a href="login.html">로그인</a></p>
    </form>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/price.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
