<!doctype html>
<html lang="ko" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검색 결과 — GlobalPrice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">
<div id="site-header"></div>

<main class="page container" style="gap:16px">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px">
    <h1 class="page-title" id="resultTitle">검색 결과</h1>
    <span class="small muted" id="ratesNote"></span>
  </div>

  <div class="search-layout">
    <aside class="card filters" id="filterPanel" aria-label="검색 필터">
      <form id="filterForm">
        <fieldset>
          <legend>판매처</legend>
          <!-- 목록은 search.js 가 그림: 목업 = mock-data.js stores, 실제 서버 = config.js STORES -->
          <div id="storeFilter" class="filter-list"></div>
        </fieldset>
        <fieldset style="margin-top:18px">
          <legend>출발 국가</legend>
          <label><input type="checkbox" name="countries" value="US">미국</label>
          <label><input type="checkbox" name="countries" value="CN">중국</label>
          <label><input type="checkbox" name="countries" value="JP">일본</label>
          <label><input type="checkbox" name="countries" value="KRW">원화 결제 (국내 직구관)</label>
        </fieldset>
        <fieldset style="margin-top:18px">
          <legend>행사 · 혜택</legend>
          <label><input type="checkbox" name="benefits" value="event">행사 · 쿠폰 진행 중</label>
          <label><input type="checkbox" name="benefits" value="freeShip">무료배송</label>
          <label class="mock-only"><input type="checkbox" name="benefits" value="taxIncluded">관부가세 포함가</label>
          <label><input type="checkbox" name="inStock" value="true">품절 제외</label>
        </fieldset>
        <fieldset style="margin-top:18px">
          <legend>예상 구매비용 (원)</legend>
          <div class="price-range">
            <label for="minPrice" class="sr-only">최소 금액</label>
            <input id="minPrice" name="minPrice" type="number" min="0" step="1000" placeholder="최소" inputmode="numeric">
            <span aria-hidden="true">~</span>
            <label for="maxPrice" class="sr-only">최대 금액</label>
            <input id="maxPrice" name="maxPrice" type="number" min="0" step="1000" placeholder="최대" inputmode="numeric">
          </div>
          <button type="button" class="btn btn-line btn-sm" id="priceApply">금액 적용</button>
        </fieldset>
        <button type="reset" class="btn btn-line btn-sm" style="margin-top:18px;width:100%">필터 초기화</button>
      </form>
      <div class="ad-slot" data-ad-slot="search-side" style="min-height:240px">광고 영역 (300×250)</div>
      <button type="button" class="btn btn-primary filter-close" id="filterClose">결과 보기</button>
    </aside>

    <section class="results" aria-label="검색 결과 목록">
      <div class="card result-toolbar">
        <!-- 좁은 화면에서만 보임: 필터를 접어 두고 결과를 먼저 보여줌 -->
        <button type="button" class="btn btn-line btn-sm filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterPanel">필터<span class="filter-count" id="filterCount"></span></button>
        <div class="sort-group" role="group" aria-label="정렬">
          <button type="button" data-sort="total" aria-pressed="true">예상 구매비용 낮은순</button>
          <button type="button" class="mock-only" data-sort="popular" aria-pressed="false">인기순</button>
          <button type="button" class="mock-only" data-sort="rating" aria-pressed="false">평점순</button>
          <button type="button" data-sort="discount" aria-pressed="false">할인율순</button>
        </div>
        <button type="button" class="toggle" id="couponToggle" role="switch" aria-checked="true">쿠폰 · 행사 적용가로 보기<span class="track" aria-hidden="true"></span></button>
      </div>
      <p class="status-note hidden" id="sourceNote" role="status"></p>
      <!-- 다나와식 상단 체크표: 검색 결과에 있는 제조사 · 모델 · 용량 · 색상만 자동으로 뜸 -->
      <div class="card facet-box hidden" id="facetBox" aria-label="상품 조건 선택"></div>
      <div id="resultList" aria-live="polite"></div>
      <nav class="pager hidden" id="pager" aria-label="검색 결과 페이지"></nav>
      <p class="notice">* <span class="mock-only">예시 데이터. </span>가격은 쿠폰 · 배송비 · 관부가세(추정) · 해외결제 수수료를 반영한 원화 예상 구매비용이며, 쿠폰은 쇼핑몰 · 회원 조건에 따라 달라질 수 있어요. 판매처 순위는 광고와 무관해요.</p>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/price.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/search.js"></script>
</body>
</html>
