// =====================================================
// GlobalPrice 백엔드 빌드 설정
//  - 실행: gradlew bootRun (Windows: gradlew.bat bootRun)
//  - 테스트: gradlew test  (Testcontainers 통합 테스트는 Docker 가 켜져 있을 때만 실행)
// =====================================================
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.teamsoda'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 · 검증
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 외부 API 호출 (RestClient)
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // 캐시 (소스별 검색 결과 10분)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // 비밀번호 BCrypt (Spring Security 전체는 쓰지 않음)
    implementation 'org.springframework.security:spring-security-crypto'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'Asia/Seoul'
    // GP_TEST_DB_URL 이 있으면 Docker 없이 그 DB 로 통합 테스트 (IntegrationTestBase 참고)
}

// 화면: ../GlobalPrice_frontend/static (원본 하나만 관리) 을 빌드할 때 static/ 으로 복사한다.
// 서버에서는 실제 API 를 쓰도록 js/config.js 의 USE_MOCK 만 false 로 바꾼다 (예전에는 손으로 복사본을 맞췄음)
def frontendStatic = file('../GlobalPrice_frontend/static')
tasks.named('processResources', ProcessResources) {
    inputs.dir(frontendStatic)
    from(frontendStatic) {
        into 'static'
        filesMatching('js/config.js') {
            filter { String line -> line.replace('USE_MOCK: true', 'USE_MOCK: false') }
        }
    }
    doLast {
        def config = file("${destinationDir}/static/js/config.js")
        if (!config.exists() || !config.getText('UTF-8').contains('USE_MOCK: false')) {
            throw new GradleException("static/js/config.js 에 USE_MOCK: false 가 없음 (GlobalPrice_frontend/static/js/config.js 형식 확인)")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}
